dependencies:
  espressif/esp_wifi_remote:
    matches:
      - if: "idf_version >= 6.0"
        version: ">=1.6,<2.0"
      - if: "idf_version < 6.0"
        version: "0.14.*"
  espressif/esp_hosted:
    matches:
      - if: "idf_version >= 6.0"
        version: ">=2.12,<3.0"
      - if: "idf_version < 6.0"
        version: "1.4.*"
  waveshare/esp32_p4_platform:
    version: ">=2.0,<3.0"
  espressif/esp_video:
    version: ">=2.2,<3.0"
  espressif/esp_new_jpeg:
    version: "*"
  espressif/esp_codec_dev:
    version: ">=1.5,<2.0"
  espressif/esp_websocket_client:
    version: ">=1.5,<2.0"
  idf:
    version: ">=5.4"
